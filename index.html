<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Java</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 8px;
            background: #f8f9fa;
        }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        header img { max-width: 20px; height: auto; }
        header h1  { font-size: 15px; color: #333; }

        table { border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        th {
            border: 1px solid #ccc; font-weight: normal; font-size: 11px;
            text-align: center; height: 20px; padding: 0 4px;
            user-select: none; background: #eee;
        }
        th.col-h { width: 80px; }
        th.num-h { width: 32px; }
        td {
            border: 1px solid #ddd; font-size: 12px;
            width: 80px; height: 22px; text-align: center;
        }
        td.num-h {
            background: #eee; border-color: #ccc; text-align: center;
            font-size: 11px; color: #666; user-select: none; width: 32px;
        }
        #status { font-size: 11px; color: #666; margin-top: 5px; min-height: 14px; }
    </style>
</head>
<body>

<header>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJWeABAmhV12Opm1jZmowmC4qXr4_-G8vnPoG2keoC6Q&s=10" alt="logo"/>
    <h1>Excel Java</h1>
</header>

<table>
    <thead></thead>
    <tbody></tbody>
</table>

<div id="status">Hoja1</div>

<script>

const ROWS  = 20
const COLS  = 25
const FIRST = 65   

const range     = n => Array.from({ length: n }, (_, i) => i)
const colLetter = i => String.fromCharCode(FIRST + i)

function render() {
    
    document.querySelector('thead').innerHTML = `<tr>
        <th class="num-h"></th>
        ${range(COLS).map(i => `<th class="col-h">${colLetter(i)}</th>`).join('')}
    </tr>`

    document.querySelector('tbody').innerHTML = range(ROWS).map(row =>
        `<tr>
            <td class="num-h">${row + 1}</td>
            ${range(COLS).map(() => `<td></td>`).join('')}
        </tr>`
    ).join('')
}

render()
</script>
</body>
</html>
