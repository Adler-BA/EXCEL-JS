<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Java</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 8px; background: #f8f9fa;
        }
        header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        header img { max-width: 20px; height: auto; }
        header h1  { font-size: 15px; color: #333; }

        .formula-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
        #cell-name {
            width: 44px; text-align: center; border: 1px solid #ccc;
            padding: 2px 4px; background: #eee; font-size: 12px;
        }
        #formula-input {
            flex: 1; border: 1px solid #ccc; padding: 2px 6px;
            font-size: 12px; background: #fff; font-family: monospace;
        }
        table { border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        th {
            border: 1px solid #ccc; font-weight: normal; font-size: 11px;
            text-align: center; height: 20px; padding: 0 4px;
            user-select: none; background: #eee;
        }
        th.col-h { width: 80px; }
        th.num-h { width: 32px; }
        td {
            border: 1px solid #ddd; font-size: 12px;
            width: 80px; height: 22px; position: relative; padding: 0;
        }
        td.num-h {
            background: #eee; border-color: #ccc; text-align: center;
            font-size: 11px; color: #666; user-select: none; width: 32px;
        }
        .cv {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            padding: 0 4px; overflow: hidden; white-space: nowrap; pointer-events: none;
        }
        .ci {
            position: absolute; inset: 0; border: 0; opacity: 0;
            pointer-events: none; width: 100%; height: 100%;
            font-size: 12px; text-align: center;
            background: transparent; font-family: monospace;
        }
        .ci:focus {
            opacity: 1; outline: 2px solid #1a73e8;
            outline-offset: -2px; background: #fff; z-index: 2; pointer-events: auto;
        }
        .err  { color: #e74c3c; font-size: 10px; font-style: italic; }
        td.active { outline: 2px solid #1a73e8; outline-offset: -2px; z-index: 1; }
        #status { font-size: 11px; color: #666; margin-top: 5px; min-height: 14px; }
    </style>
</head>
<body>

<header>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJWeABAmhV12Opm1jZmowmC4qXr4_-G8vnPoG2keoC6Q&s=10" alt="logo"/>
    <h1>Excel Java</h1>
</header>

<div class="formula-bar">
    <span id="cell-name">—</span>
    <input id="formula-input" type="text" placeholder="" readonly />
</div>

<table>
    <thead></thead>
    <tbody></tbody>
</table>

<div id="status">Hoja1</div>

<script>
const ROWS  = 20
const COLS  = 25
const FIRST = 65

const $  = s => document.querySelector(s)
const $$ = s => document.querySelectorAll(s)
const range     = n => Array.from({ length: n }, (_, i) => i)
const colLetter = i => String.fromCharCode(FIRST + i)

function escAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
}
function setStatus(msg) {
    $('#status').textContent = msg
    clearTimeout(setStatus._t)
    setStatus._t = setTimeout(() => { $('#status').textContent = 'Lista' }, 3000)
}

function tokenize(formula) {
    const tokens = []
    let i = 0
    while (i < formula.length) {
        const ch = formula[i]
        if (ch === ' ' || ch === '\t') { i++; continue }

        if (/\d/.test(ch) || (ch === '.' && /\d/.test(formula[i + 1] ?? ''))) {
            let s = ''
            while (i < formula.length && /[\d.]/.test(formula[i])) s += formula[i++]
            tokens.push({ t: 'NUM', v: parseFloat(s) })
            continue
        }


        if (/[A-Za-z]/.test(ch)) {
            throw new Error('#ERROR!')
        }

        if ('+-*/'.includes(ch)) { tokens.push({ t: 'OP', v: ch }); i++; continue }
        if (ch === '(')          { tokens.push({ t: 'LP'        }); i++; continue }
        if (ch === ')')          { tokens.push({ t: 'RP'        }); i++; continue }

        throw new Error('#ERROR!')
    }
    return tokens
}


function parseFormula(tokens) {
    let pos = 0
    const peek    = () => tokens[pos]
    const consume = () => tokens[pos++]
    const expect  = type => {
        const tok = consume()
        if (!tok || tok.t !== type) throw new Error('#ERROR!')
        return tok
    }

    function expr() {
        let left = term()
        while (peek()?.t === 'OP' && (peek().v === '+' || peek().v === '-')) {
            const op    = consume().v
            const right = term()
            left = op === '+' ? left + right : left - right
        }
        return left
    }

    function term() {
        let left = factor()
        while (peek()?.t === 'OP' && (peek().v === '*' || peek().v === '/')) {
            const op    = consume().v
            const right = factor()
            if (op === '/') {
                if (right === 0) throw new Error('#DIV/0!')
                left = left / right
            } else {
                left = left * right
            }
        }
        return left
    }

    function factor() {
        const tok = peek()
        if (!tok) throw new Error('#ERROR!')
        if (tok.t === 'OP' && tok.v === '-') { consume(); return -factor() }
        if (tok.t === 'OP' && tok.v === '+') { consume(); return +factor() }
        if (tok.t === 'LP') {
            consume()
            const v = expr()
            expect('RP')
            return v
        }
        if (tok.t === 'NUM') { consume(); return tok.v }
        throw new Error('#ERROR!')
    }

    const result = expr()
    if (pos < tokens.length) throw new Error('#ERROR!')
    return result
}


function evalCell(cellId, value) {
    if (value === '' || value == null) return 0
    if (typeof value === 'number') return value
    if (!value.startsWith('=')) {
        const n = parseFloat(value)
        return isNaN(n) ? value : n
    }
    const formula = value.slice(1).trim()
    if (!formula) return 0
    try {
        const tokens = tokenize(formula)
        return parseFormula(tokens)
    } catch (e) {
        return e.message.startsWith('#') ? e.message : '#ERROR!'
    }
}

let STATE = range(COLS).map(() =>
    range(ROWS).map(() => ({ value: '', computedValue: 0 }))
)
let activeCell = null

function computeAll(state) {
    state.forEach((col, x) =>
        col.forEach((cell, y) => {
            const id = `${colLetter(x)}${y + 1}`
            cell.computedValue = evalCell(id, cell.value)
        })
    )
}

function updateCell({ x, y, value }) {
    const s = structuredClone(STATE)
    s[x][y].value = value
    computeAll(s)
    STATE = s
    render()
}

function render() {
    $('thead').innerHTML = `<tr>
        <th class="num-h"></th>
        ${range(COLS).map(i => `<th class="col-h">${colLetter(i)}</th>`).join('')}
    </tr>`

    $('tbody').innerHTML = range(ROWS).map(row =>
        `<tr>
            <td class="num-h">${row + 1}</td>
            ${range(COLS).map(col => {
                const cell  = STATE[col][row]
                const v     = cell.computedValue
                const isErr = typeof v === 'string' && v.startsWith('#')
                const disp  = (v === 0 && cell.value === '') ? '' : v
                const spanCls = isErr ? 'cv err' : 'cv'
                const isAct = activeCell?.x === col && activeCell?.y === row
                return `<td data-x="${col}" data-y="${row}" class="${isAct ? 'active' : ''}">
                    <span class="${spanCls}">${disp}</span>
                    <input class="ci" type="text" value="${escAttr(cell.value)}" />
                </td>`
            }).join('')}
        </tr>`
    ).join('')
}

function activateCell(x, y) {
    activeCell = { x, y }
    render()
    const td    = $(`td[data-x="${x}"][data-y="${y}"]`)
    const input = td?.querySelector('.ci')
    if (!input) return
    $('#cell-name').textContent = `${colLetter(x)}${y + 1}`
    $('#formula-input').value   = STATE[x][y].value
    input.style.opacity       = '1'
    input.style.pointerEvents = 'auto'
    input.focus()
    input.setSelectionRange(input.value.length, input.value.length)
    const onInput = () => { $('#formula-input').value = input.value }
    const onBlur = () => {
        input.removeEventListener('input', onInput)
        input.style.opacity       = '0'
        input.style.pointerEvents = 'none'
        if (input.value !== STATE[x][y].value) updateCell({ x, y, value: input.value })
    }
    input.addEventListener('input', onInput)
    input.addEventListener('blur',  onBlur, { once: true })
}

function setupEvents() {
    $('tbody').addEventListener('click', e => {
        const td = e.target.closest('td[data-x]')
        if (!td) return
        activateCell(Number(td.dataset.x), Number(td.dataset.y))
    })
}

render()
setupEvents()
</script>

</html>
